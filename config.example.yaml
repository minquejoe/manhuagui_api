meta:
  port: 10018
  host: 0.0.0.0
  run-mode: debug
  log-name: ./logs/console
  ppof: true
  swagger: true
  doc-host: 127.0.0.1:10018

server:
  bucket-period: 60    # token bucket fill period interval in seconds
  bucket-capacity: 200 # token bucket capacity
  bucket-quantum: 50   # token bucket quantum in every interval
  bucket-cleanup: 120  # token bucket cleanup interval in seconds
  bucket-survived: 3   # token bucket max survived times for cleanable tokens
  server-cache: true   # enable server application cache or not
  cache-size: 100      # application cache size
  cache-expire: 180    # application cache expiration in seconds
  client-cache: false  # allow client to store cached result
  def-limit: 20        # default limit query parameter value
  max-limit: 50        # maximum limit query parameter value

message:
  github-token: xxx

proxy:
  enabled: true          # route manhuagui requests through the lowest-latency xray node
  auto-install: true     # download the xray binary automatically when missing
  # xray-version: v26.3.27  # optional pinned xray release tag
  xray-bin: ./bin/xray
  xray-config: ./xray/config.json
  xray-socks-port: 10808
  xray-http-port: 10809
  xray-api-port: 10810
  subscriptions:         # v2ray-style subscription urls (base64 or plaintext)
    - https://example.com/sub?token=YOUR_TOKEN
  refresh-interval: 86400 # seconds: re-fetch the subscription and restart xray if nodes changed (24h)
  probe-interval: 3600    # seconds: re-measure every node's latency and re-select the best node (1h)
  probe-url: https://www.manhuagui.com/
  probe-extra-urls:       # extra latency targets measured per node each round (combined with probe-url)
    - https://i.hamreus.com/   # image CDN, so the pinned node is fast for images too
  hosts:                 # hosts routed through the proxy; "." prefix matches subdomains
    - manhuagui.com
    - .manhuagui.com
    - hamreus.com
    - .hamreus.com
